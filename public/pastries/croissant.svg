<svg viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Croissant shape with gradient fill -->
  <defs>
    <linearGradient id="croissantGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffe7a3;stop-opacity:1" />
      <stop offset="58%" style="stop-color:#d99532;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b4d18;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Main croissant body - curved crescent shape -->
  <path d="M 50 20 Q 100 10, 140 40 Q 130 50, 100 55 Q 60 50, 50 80 Q 45 55, 50 20" 
        fill="url(#croissantGradient)" filter="drop-shadow(0 3px 6px rgba(0,0,0,0.3))"/>
  <!-- Layered texture lines -->
  <path d="M 60 30 Q 90 25, 120 45" stroke="rgba(139,77,24,0.3)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 70 38 Q 95 32, 125 50" stroke="rgba(139,77,24,0.3)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 80 45 Q 100 40, 130 55" stroke="rgba(139,77,24,0.3)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 60 50 Q 85 48, 115 65" stroke="rgba(139,77,24,0.3)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Shine/highlight on curved surface -->
  <ellipse cx="75" cy="35" rx="20" ry="15" fill="rgba(255,255,255,0.25)" opacity="0.6"/>
</svg>