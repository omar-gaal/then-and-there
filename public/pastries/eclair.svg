<svg viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Éclair shape with gradient fill -->
  <defs>
    <linearGradient id="eclairGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#d7a870;stop-opacity:1" />
      <stop offset="58%" style="stop-color:#8b4d2d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4b281e;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Main éclair body - elongated with rounded ends -->
  <rect x="20" y="30" width="160" height="60" rx="30" fill="url(#eclairGradient)" filter="drop-shadow(0 3px 6px rgba(0,0,0,0.3))"/>
  <!-- Chocolate drizzle lines on top -->
  <path d="M 30 28 Q 50 18, 70 25" stroke="rgba(75,40,30,0.5)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 80 25 Q 100 15, 125 22" stroke="rgba(75,40,30,0.5)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 135 28 Q 155 18, 170 30" stroke="rgba(75,40,30,0.5)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Shine/highlight -->
  <ellipse cx="100" cy="40" rx="70" ry="15" fill="rgba(255,255,255,0.2)"/>
</svg>